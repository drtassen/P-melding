<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RetroHub Kveldsgaming</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
    color:white;

    background-image:url('Hub.jpg');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:-1;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    margin:0;
}

button{
    padding:12px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:1em;
}

.theme-btn{
    background:#444;
    color:white;
}

.admin-btn{
    background:#007bff;
    color:white;
}

.status{
    padding:20px;
    border-radius:10px;
    text-align:center;
    font-size:1.3em;
    margin-bottom:20px;
    font-weight:bold;
}

.ledig{
    background:#1d6f42;
}

.full{
    background:#8b1e1e;
}

form,
.admin-panel,
li,
.game-box{
    background:rgba(0,0,0,0.75);
    padding:20px;
    border-radius:12px;
    backdrop-filter:blur(4px);
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:1em;
}

textarea{
    resize:vertical;
    min-height:80px;
}

.submit-btn{
    background:#28a745;
    color:white;
    width:100%;
}

ul{
    padding:0;
}

li{
    list-style:none;
}

.slett{
    color:#ff6b6b;
    cursor:pointer;
    font-weight:bold;
}

.slettEgen{
    background:#dc3545;
    color:white;
    margin-top:10px;
}

.info{
    text-align:center;
    color:#ddd;
}

canvas{
    background:black;
    border:3px solid #00ff88;
    display:block;
    margin:auto;
}

</style>

</head>
<body>

<div class="header">

    <h1>🎮 RetroHub Kveldsgaming</h1>

    <div>
    
        <button id="adminBtn" class="admin-btn">🔑 Admin</button>
    </div>

</div>

<div id="status" class="status">Laster...</div>

<form id="pameldingForm">

    <input type="text" id="navn" placeholder="Deltager i stredet" required>

    <input type="text" id="forelderNavn" placeholder="Forelders fulle navn" required>

    <input type="tel" id="forelderTelefon" placeholder="Forelders telefonnummer" required>

    <textarea id="bat" placeholder="BAT - Behov / Allergier / Tilstander"></textarea>

    <button type="submit" class="submit-btn">Meld meg på</button>

</form>

<div id="adminPanel" class="admin-panel" style="display:none;">

    <h3>✅ Admin-modus aktivert</h3>

    <button onclick="tomListe()" style="background:#dc3545;color:white;width:100%;">
        🗑️ Tøm hele listen
    </button>

</div>

<h2>Påmeldte (<span id="antall">0</span>/20)</h2>

<ul id="liste"></ul>

<div class="game-box">

    <h2>🎮 Gaming Quiz</h2>

    <div id="quiz">

        <h3 id="sporsmal">
            Laster spørsmål...
        </h3>

        <div id="svar"></div>

        <p id="score">
            Score: 0
        </p>

    </div>

</div>

<p class="info">
Maks 20 plasser • Lagres i nettleseren
</p>

<script src="script.js"></script>

</body>
</html>
